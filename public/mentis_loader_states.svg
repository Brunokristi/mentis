        }

        .ring {
            fill: none;
            stroke: var(--mentis-terakota);
            stroke-width: 3;
            stroke-linecap: round;
        }

        .logo {
            fill: var(--mentis-terakota);
        }
    </style>

    <circle
        id="mentis-ring"
        class="ring"
        cx="65.5"
        cy="65.5"
        r="64"
        pathLength="1002"
        stroke-dasharray="455 547"
