69.941,42.348C69.941,42.348 69.941,59.951 69.954,66.458C69.954,67.041 70.236,67.588 70.710,67.928C71.185,68.267 71.794,68.357 72.346,68.168C80.155,65.520 82.588,59.678 84.032,56.828C86.254,52.445 87.935,38.480 88.535,31.586C88.588,30.947 88.302,30.328 87.781,29.955C81.979,25.844 74.893,23.427 67.246,23.427C56.101,23.427 46.147,28.562 39.626,36.595C39.018,37.355 39.119,38.461 39.855,39.098Z"
    />

    <script><![CDATA[
        /*
         * Mentis loader
         *
         * Same animation architecture as the reference loader:
         * - the ring continuously travels around the logo while loading
         * - the same ring naturally closes when loading completes
         * - the Mentis symbol smoothly morphs into the approved
         *   success/error geometry
         *
         * API:
         *
         *     mentisLoader.setState("loading");
         *     mentisLoader.setState("success");
         *     mentisLoader.setState("error");
         */

        const ring = document.getElementById("mentis-ring");
        const logo = document.getElementById("mentis-logo");

        const ORIGINAL_PATH = `M69.631,124.357C68.266,124.452 66.889,124.500 65.500,124.500C64.759,124.500 64.022,124.486 63.288,124.459C63.264,106.909 63.232,83.328 63.219,77.132C63.218,76.260 62.595,75.513 61.738,75.353C52.466,73.564 46.715,66.552 43.018,58.085C41.166,53.842 40.405,48.991 36.719,45.107C36.377,44.750 35.880,44.585 35.392,44.669C34.905,44.753 34.490,45.074 34.288,45.525C32.236,50.030 33.532,53.449 31.958,58.092C31.492,59.466 30.753,59.689 30.063,60.306C29.761,60.577 28.358,61.758 26.595,62.869C24.876,63.953 23.613,64.337 23.430,65.404C23.360,65.538 23.424,66.233 23.412,66.271C23.435,66.324 23.404,66.392 23.427,66.446C23.569,67.251 23.867,67.653 25.676,68.683C29.220,70.701 28.586,71.697 26.830,75.376C25.812,77.510 26.284,77.677 27.608,79.382C27.842,79.684 26.784,80.231 26.638,80.326C25.023,81.370 25.606,82.981 25.784,84.569C26.050,86.936 23.719,90.360 25.716,92.445C29.904,96.815 38.046,96.997 42.225,98.825C44.070,99.632 48.136,102.028 48.658,102.445C50.687,104.064 53.363,104.673 53.748,111.416C54.066,116.996 53.487,120.508 52.973,123.165C26.419,117.415 6.500,93.765 6.500,65.500C6.500,32.937 32.937,6.500 65.500,6.500C98.063,6.500 124.500,32.937 124.500,65.500C124.500,88.324 111.511,108.139 92.529,117.950C90.540,113.937 87.247,108.150 87.902,102.311C88.841,93.928 90.436,90.968 91.357,88.964C94.739,81.608 100.490,76.979 102.853,69.091C105.750,59.419 102.155,49.284 100.284,45.802C99.892,44.821 99.457,43.862 98.983,42.927C98.530,42.034 98.040,41.163 97.517,40.315C97.116,39.662 96.347,39.331 95.597,39.488C94.846,39.645 94.275,40.256 94.169,41.015C93.180,48.338 91.720,56.565 90.042,59.875C87.966,63.970 84.209,72.641 71.368,75.422C70.534,75.602 69.937,76.337 69.932,77.190C69.890,83.755 69.719,110.472 69.631,124.357ZM39.855,39.098C45.319,43.873 46.781,49.864 49.193,55.389C51.668,61.057 55.171,66.098 60.795,68.134C61.352,68.332 61.971,68.247 62.454,67.906C62.937,67.564 63.224,67.010 63.224,66.419L63.224,42.348C63.224,40.494 64.729,38.989 66.582,38.989C68.436,38.989 69.941,40.494 69.941,42.348C69.941,42.348 69.941,59.951 69.954,66.458C69.954,67.041 70.236,67.588 70.710,67.928C71.185,68.267 71.794,68.357 72.346,68.168C80.155,65.520 82.588,59.678 84.032,56.828C86.254,52.445 87.935,38.480 88.535,31.586C88.588,30.947 88.302,30.328 87.781,29.955C81.979,25.844 74.893,23.427 67.246,23.427C56.101,23.427 46.147,28.562 39.626,36.595C39.018,37.355 39.119,38.461 39.855,39.098Z`;

        const SUCCESS_PATH = `M 53.322,86.068 53.549,86.252 53.806,86.388 54.085,86.472 54.375,86.500 54.665,86.472 54.944,86.388 55.201,86.252 55.428,86.068 98.053,44.068 98.241,43.843 98.382,43.584 98.469,43.303 98.500,43.011 98.473,42.718 98.390,42.436 98.253,42.176 98.068,41.947 97.843,41.759 97.584,41.618 97.303,41.531 97.011,41.500 96.718,41.527 96.436,41.610 96.176,41.747 95.947,41.932 54.375,82.894 36.053,64.841 35.824,64.656 35.564,64.519 35.282,64.436 34.989,64.409 34.697,64.440 34.416,64.528 34.157,64.668 33.932,64.856 33.747,65.085 33.610,65.345 33.527,65.627 33.500,65.920 33.531,66.213 33.618,66.493 33.759,66.752 33.947,66.978 53.322,86.068 Z`;

        const ERROR_PATH = `M 84.658,86.242 84.917,86.382 85.198,86.469 85.490,86.500 85.783,86.473 86.065,86.390 86.325,86.253 86.554,86.068 86.742,85.842 86.882,85.583 86.969,85.302 87.000,85.010 86.973,84.717 86.890,84.435 86.753,84.175 86.568,83.946 68.857,66.000 86.568,48.054 86.753,47.825 86.890,47.565 86.973,47.283 87.000,46.990 86.969,46.698 86.882,46.417 86.742,46.158 86.554,45.932 86.325,45.747 86.065,45.610 85.783,45.527 85.490,45.500 85.198,45.531 84.917,45.618 84.658,45.758 84.432,45.946 66.750,63.864 49.068,45.946 48.842,45.758 48.583,45.618 48.302,45.531 48.010,45.500 47.717,45.527 47.435,45.610 47.175,45.747 46.946,45.932 46.758,46.158 46.618,46.417 46.531,46.698 46.500,46.990 46.527,47.283 46.610,47.565 46.747,47.825 46.932,48.054 64.643,66.000 46.932,83.946 46.747,84.175 46.610,84.435 46.527,84.717 46.500,85.010 46.531,85.302 46.618,85.583 46.758,85.842 46.946,86.068 47.175,86.253 47.435,86.390 47.717,86.473 48.010,86.500 48.302,86.469 48.583,86.382 48.842,86.242 49.068,86.054 66.750,68.136 84.432,86.054 84.658,86.242 Z`;

        const CIRCUMFERENCE = 1002;
        const LOADING_LENGTH = 455;
        const LOADING_GAP = CIRCUMFERENCE - LOADING_LENGTH;

        let loadingFrame = null;
        let morphFrame = null;

        function ease(t) {
            const smooth = t * t * (3 - 2 * t);
            return 1 - Math.pow(1 - smooth, 2.2);
        }

        async function morphTo(target, duration) {
            if (morphFrame) {
                cancelAnimationFrame(morphFrame);
                morphFrame = null;
            }

            let interpolate;

            if (
                window.flubber &&
                typeof window.flubber.interpolate === "function"
            ) {
                interpolate = window.flubber.interpolate;
            } else {
                const module = await import(
                    "https://cdn.jsdelivr.net/npm/flubber@0.4.2/+esm"
                );

                interpolate = module.interpolate;
            }

            const from = logo.getAttribute("d");

            const interpolator = interpolate(from, target, {
                maxSegmentLength: 3
            });

            const start = performance.now();

            function frame(now) {
                const raw = Math.min(
                    (now - start) / duration,
                    1
                );

                logo.setAttribute(
                    "d",
                    interpolator(ease(raw))
                );

                if (raw < 1) {
                    morphFrame = requestAnimationFrame(frame);
                } else {
                    morphFrame = null;
                }
            }

            morphFrame = requestAnimationFrame(frame);
        }

        function startLoadingRing() {
            if (loadingFrame) {
                cancelAnimationFrame(loadingFrame);
            }

            const start = performance.now();

            function frame(now) {
                const elapsed = now - start;

                const offset =
                    -((elapsed / 1250) * CIRCUMFERENCE)
                    % CIRCUMFERENCE;

                ring.style.strokeDasharray =
                    `${LOADING_LENGTH} ${LOADING_GAP}`;

                ring.style.strokeDashoffset = offset;

                loadingFrame = requestAnimationFrame(frame);
            }

            loadingFrame = requestAnimationFrame(frame);
        }

        function completeRing() {
            if (loadingFrame) {
                cancelAnimationFrame(loadingFrame);
                loadingFrame = null;
            }

            const currentOffset =
                parseFloat(
                    getComputedStyle(ring).strokeDashoffset
                ) || 0;

            const duration = 1250;
            const tailTravel = CIRCUMFERENCE * 0.085;
            const start = performance.now();

            function complete(now) {
                const raw = Math.min(
                    (now - start) / duration,
                    1
                );

                const tailProgress =
                    1 - Math.pow(1 - raw, 4);

                const tailOffset =
                    currentOffset -
                    tailTravel * tailProgress;

                const lengthProgress =
                    1 - Math.pow(1 - raw, 2.2);

                const length =
                    LOADING_LENGTH +
                    (CIRCUMFERENCE - LOADING_LENGTH)
                    * lengthProgress;

                ring.style.strokeDashoffset = tailOffset;

                ring.style.strokeDasharray =
                    `${length} ${CIRCUMFERENCE - length}`;

                if (raw < 1) {
                    requestAnimationFrame(complete);
                } else {
                    ring.style.strokeDasharray =
                        `${CIRCUMFERENCE} 0`;

                    ring.style.strokeDashoffset =
                        tailOffset;
                }
            }

            requestAnimationFrame(complete);
        }

        async function setState(state) {
            if (morphFrame) {
                cancelAnimationFrame(morphFrame);
                morphFrame = null;
            }

            if (loadingFrame) {
                cancelAnimationFrame(loadingFrame);
                loadingFrame = null;
            }

            if (state === "loading") {
                logo.setAttribute("d", ORIGINAL_PATH);
                logo.style.fill = "var(--mentis-terakota)";

                ring.style.strokeDasharray =
                    `${LOADING_LENGTH} ${LOADING_GAP}`;

                ring.style.strokeDashoffset = "0";

                startLoadingRing();
                return;
            }

            logo.style.fill = "var(--mentis-terakota)";

            completeRing();

            if (state === "success") {
                await morphTo(SUCCESS_PATH, 720);
            } else if (state === "error") {
                await morphTo(ERROR_PATH, 720);
            }
        }

        window.mentisLoader = {
            setState
        };

        setState("loading");
    ]]></script>
</svg>
